name: Deploy to GitHub Pages

# Publishes the static dashboard. The app runs entirely in the browser against
# free public APIs, so no build step or secrets are required.
# Deploys on push to the repo's default branch (GitHub Pages' environment only
# accepts the default branch) as well as main, plus manual runs.
on:
  push:
    branches: [main, "claude/charming-fermat-9ht677"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
